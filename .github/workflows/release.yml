name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (라이선스 동의)
        uses: android-actions/setup-android@v3

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 키스토어 복원 (KEYSTORE_BASE64 시크릿 있을 때만)
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HAS_KEYSTORE" ]; then
            echo "$HAS_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            test -s "$RUNNER_TEMP/release.jks"
            echo "키스토어 복원 완료"
          else
            echo "시크릿 없음 → unsigned APK 빌드"
          fi

      - name: Release APK 빌드
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: 태그에 해당하는 CHANGELOG 섹션 추출
        id: changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v t="$tag" '
            BEGIN { capt = 0 }
            $0 ~ "^## \\[" t "\\]" { capt = 1; next }
            capt && /^## / { exit }
            capt { print }
          ' docs/CHANGELOG.md > "$RUNNER_TEMP/release_body.md"
          if [ ! -s "$RUNNER_TEMP/release_body.md" ]; then
            printf "PlanJupJup %s\n\n자세한 변경 사항은 docs/CHANGELOG.md를 참고하세요.\n" "$tag" > "$RUNNER_TEMP/release_body.md"
          fi
          echo "body_ready=1" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: ${{ runner.temp }}/release_body.md